services:
  slideshow:
    build: .
    container_name: visitor-photo-slideshow
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ADMIN_API_KEY=admin123
      - SLIDE_DURATION_SECONDS=6
      - AMBIENT_LOOP_DURATION_SECONDS=8
      - MAX_FILE_SIZE_MB=10
      - MAX_FILES_PER_UPLOAD=5
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
